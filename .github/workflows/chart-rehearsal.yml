name: Chart Rehearsal (fork-only, never upstream)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package and push"
        required: true
        type: string
        default: "0.0.0-rehearsal1"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  HELM_VERSION: v4.2.4

jobs:
  rehearse:
    name: Rehearse chart publish
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Get owner in lowercase
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Package chart
        run: |
          helm package charts/sockudo \
            --version "${{ inputs.version }}" \
            --app-version "${{ inputs.version }}" \
            --destination dist

      - name: Push chart
        run: |
          helm push "dist/sockudo-${{ inputs.version }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/charts"

      - name: Pull it back to prove it is consumable
        run: |
          mkdir -p /tmp/pulled
          helm pull "oci://${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/charts/sockudo" \
            --version "${{ inputs.version }}" --destination /tmp/pulled
          ls -l /tmp/pulled
